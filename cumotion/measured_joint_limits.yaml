  method: global per-joint [min,max] over the session
  date: '2026-09-04'
  margin_deg: 5.0
  jitter_evidence: 'startup gate: 251 samples, 6.202 mdeg jitter; min recent jitter
    while recording: 4.808 mdeg'
  extremes_rad:
