# human_safety configuration — cameras + safety zones/budgets.
#
# PROVISIONAL DEFAULTS. The zone radii and time budgets below are conservative
# placeholders, NOT derived separation distances. The real separation distances
# are being computed by task human-safety-s1
# ($HOME/firstmate/data/human-safety-s1/report.md); replace these
# when that lands. This package is a SUPPLEMENTARY camera layer, never a
# certified safety function — see cams/human_safety/README.md.

base_frame: base_link
ground_z: 0.0            # cell floor height in base_link (m); tune per install
height_prior: 1.7        # assumed standing person height (m) for monocular lift
detector: keypoint_rcnn
device: cuda
score_thresh: 0.6
fusion_rate: 15.0        # Hz, fusion + safety publish cycle (>=10 Hz per human-safety-s1 §7)
viz_rate: 6.0            # Hz, owner window redraw (modest for SSH X-forwarding)

# Frame processing. DEFAULT is the shipped every-frame baseline: one detector
# process per camera (mode: per_camera), each detecting every frame up to its
# rate cap, in parallel. The efficient path (mode: shared) runs ONE detector
# instance that batches the frames needing detection in a single forward pass
# per tick; with scheduler.enabled it additionally skips frames that do not need
# a fresh look (quiet cameras drop to the 1/t_max floor; a camera with motion or
# a track near the robot runs at the full rate). See cams/human_safety/README.md
# "Efficient frame processing" and tools/bench_frame_processing.py for the
# baseline-vs-efficient evidence. Switch to the efficient path by setting
# mode: shared and scheduler.enabled: true (or override at launch with mode:=shared).
frame_processing:
  mode: per_camera       # per_camera (baseline, DEFAULT) | shared (batched)
  schedule_rate: 15.0    # Hz, shared-detector scheduling tick rate
  fp16: false            # half-precision inference (opt-in; verify no material change)
  scheduler:
    enabled: false       # frame selection off = batch every camera every tick (baseline-equivalent)
    t_max: 0.4           # hard max interval (s) between FULL detections per camera; MUST be <= frame_age_budget
    busy_min_period: 0.0667   # min interval (s) between detections for a busy camera (~15 Hz)
    motion_threshold: 0.02    # normalised change score (0..1) above which a camera is "busy"
    near_margin: 0.5     # a confirmed track within (slow envelope + this) m makes ALL cameras busy
    downscale: 8         # block-mean factor for the cheap change-score thumbnail
    max_batch: 8         # cap frames per batched forward pass

cameras:
  # WRIST D435i — mounted UPSIDE DOWN; consume the UPRIGHT twin (the stream the
  # hand-eye calibration and the cell map were solved against). Pose needs the
  # robot's joint states at the frame stamp; the driver is DOWN, so TF lookup
  # fails and the wrist contributes PRESENCE ONLY (flagged). It only delivers
  # ~6 fps read directly on this machine, hence max_rate 6.
  - role: wrist
    color_topic: /wrist/color_upright/image_raw
    info_topic:  /wrist/color_upright/camera_info
    depth_topic: /wrist/aligned_depth_upright/image
    depth_info_topic: /wrist/aligned_depth_upright/camera_info
    has_depth: true
    optical_frame: wrist_color_upright_optical_frame
    max_rate: 6.0
    min_range: 0.17
    max_range: 4.0
    pose_source: tf

  # SHELF D415 (021422061772) — fixed, high, near-frontal at the gondola shelf.
  # NO trustworthy pose today (Step-2 AprilTag world-alignment not done): with
  # no static base<-optical TF published, it contributes PRESENCE ONLY until
  # calibrated with tools/calibrate_d415_apriltag.py.
  - role: shelf
    color_topic: /shelf/color/image_raw
    info_topic:  /shelf/color/camera_info
    depth_topic: /shelf/aligned_depth/image
    depth_info_topic: /shelf/aligned_depth/camera_info
    has_depth: true
    optical_frame: shelf_color_optical_frame
    max_rate: 15.0
    min_range: 0.3
    max_range: 6.0
    pose_source: tf

  # TABLE D415 (025522060953) — fixed, wide side view of arm + shelf + transit
  # volume. NO trustworthy pose today (same as shelf). PRESENCE ONLY until
  # calibrated.
  - role: table
    color_topic: /table/color/image_raw
    info_topic:  /table/color/camera_info
    depth_topic: /table/aligned_depth/image
    depth_info_topic: /table/aligned_depth/camera_info
    has_depth: true
    optical_frame: table_color_optical_frame
    max_rate: 15.0
    min_range: 0.3
    max_range: 6.0
    pose_source: tf

safety:
  reach_radius: 1.30      # UR10 reach; envelope = cylinder of this radius about base z
  stop_radius: 0.70       # PROTECTIVE ring: reach+this = 2.0 m of base (human-safety-s1 §3, PROVISIONAL)
  # Estimator margin ADDED to the STOP TRIGGER only (never to the protective ring
  # above). The zone commands STOP at reach+stop_radius+stop_margin = 2.25 m of
  # base, ~0.25 m earlier than the 2.0 m protective ring, to cover the nearest-point
  # estimator's measured over-statement on the Isaac after-run test (median +0.19 m
  # / +0.25 m residual, reported FARTHER than truth). Without it STOP engages ~0.93 s
  # late vs the 0.70 s reaction budget. PROVISIONAL: shrink toward 0 only if a
  # real-rig-validated estimator improvement lands. See data/human-safety-stop-margin-v1.
  stop_margin: 0.25
  slow_radius: 2.00       # SLOW ring (any person present also forces >= SLOW)  PROVISIONAL
  hysteresis: 0.30        # extra clearance to de-escalate (anti-chatter)
  min_clear_dwell: 2.0    # must be clear this long before leaving STOP
  frame_age_budget: 0.5   # frame age over this but still answering -> SLOW
  detector_stall_timeout: 1.5   # no fresh frame this long / no status -> STOP
  reaction_time_budget: 0.7     # img->state latency over this -> STOP (fault 5)
  lost_close_margin: 0.30
  lost_hold_time: 3.0     # hold STOP this long after losing a close track
  presence_floor_slow: true
  slow_on_any_person: true   # small cell: any confirmed person present -> >= SLOW
  nearest_filter_window: 5   # zone reacts to the nearest credible body point; speckle-reject window
  nearest_filter_reject: 1   # drop this many closest samples as possible single-frame speckle
