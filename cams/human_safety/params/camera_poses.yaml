# Static camera extrinsics for the FIXED cameras, base_link -> <optical_frame>.
#
# The launch (human_safety.launch.py) starts one static_transform_publisher per
# VALID entry here, so a calibrated camera gets a base<-optical TF and the
# detector node can place its detections in the base frame. A camera not listed
# here, listed with calibrated:false, or whose calibration fails the validity
# guard (see human_safety/camera_poses.py) gets no TF and contributes PRESENCE
# ONLY -- exactly as an uncalibrated camera behaves.
#
# HOW THIS GETS FILLED IN:
#   1. Solve the extrinsic with the static-camera calibrator (this is the tool
#      human-safety-s1 §6 / Phase 2 called for; it now lives in the repo):
#        ROS_DOMAIN_ID=80 FASTDDS_BUILTIN_TRANSPORTS=UDPv4 \
#        python3 cams/cellmap/calibrate_static_camera.py \
#            --serial 025522060953 --role table \
#            --image /table/color/image_raw --info /table/color/camera_info \
#            --depth /table/aligned_depth/image \
#            --optical-frame table_color_optical_frame
#      It writes cams/cellmap/calib/base_to_camera_<serial>_<date>.yaml.
#   2. Add an entry below pointing at that file. IDENTIFY THE CAMERA BY SERIAL,
#      never by the provisional shelf/table role -- the loader refuses to publish
#      if the file's serial does not match the entry's serial (a swapped camera
#      cannot silently inherit another's pose).
#   3. Guard against a moved camera: re-run periodically
#        python3 cams/cellmap/recheck_static_camera.py \
#            --calib <that file> --image /table/color/image_raw \
#            --info /table/color/camera_info
#      A failed recheck stamps status:fail in the file and the loader then drops
#      the camera back to presence-only automatically.
#
# STATUS 2026-09-19: neither fixed D415 has a committed calibration yet (no
# mapped AprilTag is currently in either camera's view -- see
# data/human-cam-calib-v1/report.md). Both contribute presence only until a
# calibration file is produced and referenced here.
#
# Entry format (serial is the identity anchor; the transform is read from the
# calibration file, not duplicated here):
#   table:                                   # role label = optical-frame prefix
#     calibrated: true
#     serial: "025522060953"                 # MUST match the calibration file
#     child: table_color_optical_frame       # the TF the detector looks up
#     calibration_file: ../../cellmap/calib/base_to_camera_025522060953_2026-09-19.yaml
#     max_age_days: 30                        # optional: reject if older
#     require_recheck: false                  # optional: require a passing recheck

cameras: {}
