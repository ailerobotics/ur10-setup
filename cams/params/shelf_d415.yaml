# SHELF camera — Intel RealSense D415, mounted high looking at the gondola shelf.
#
# Role (placement-report.html): near-frontal shelf view ~(0.30, -0.90, 2.6),
# ~57 deg pitch, ~15 deg off the shelf normal; must see all four board front
# edges. The extrinsic (world/base_link -> shelf camera) is set in Step 2 by
# AprilTag world-alignment; this file only pins the device by serial.
#
# WHY a quoted params FILE (not serial:=): see cams/params/wrist_d435i.yaml —
# the serial_no-degrades-to-double trap. Key = node FQN: name=camera,
# namespace=/shelf -> /shelf/camera.
#
# SERIAL: both D415s enumerated 2026-08-31 (rs-enumerate-devices -s):
# 024122061936 and 025522060953 (both fw 5.12.6). The two D415s are physically
# interchangeable, so WHICH serial is SHELF vs TABLE is a PROVISIONAL assignment
# until the captain mounts them (Step 2) — swap the two YAMLs if the physical
# units end up the other way round.
/shelf/camera:
  ros__parameters:
    # 2026-09-03: 021422061772 is the second D415 plugged into this PC (the
    # cell-map "cam415b"); 024122061936, the 08-31 unit, is no longer connected.
    # `rs-enumerate-devices -s` is the authority — update this line, quoted.
    serial_no: "021422061772"   # D415, provisionally the SHELF (high) unit
