# Driver-backed human-safety gate — driver/interlock parameters (Phase 3).
#
# The DECISION thresholds (zones, dwell, heartbeat, speed fractions) still live in
# humangate/gate_params.yaml and are loaded by the gate core unchanged. This file
# documents ONLY the driver-side and arming parameters this package adds. All are
# provisional and SIMULATION-oriented; the owner-present phase re-derives the
# safety-relevant ones from measurement (report §8 / §10 Phase 4).

human_gate_driver:
  ros__parameters:
    # --- arming interlock (report §10 Phase 3; task brief item 3) --------- #
    # DISARMED by default. All three must hold to arm, and none can reach the
    # real robot: arm:=true, ROS_DOMAIN_ID not in {0,42}, and robot_ip loopback
    # or Docker-internal (never 192.168.0.1, never a physical-NIC address).
    arm: false
    robot_ip: "127.0.0.1"          # loopback (mock) or a docker-internal URSim IP

    # --- primary lever confirmation -------------------------------------- #
    # Speed slider is the primary lever. If the commanded fraction is not
    # reflected on the scaling topic within this deadline, it is logged
    # unconfirmed; the ENFORCED response is the gate/watcher backstop.
    confirm_deadline_s: 0.5
    # Applied scaling at/below this fraction counts as an effected STOP. Kept in
    # FRACTION units (the driver_io ScalingMonitor normalises the mock 0..100
    # percent scale to 0..1).
    stop_scaling_threshold: 0.05

    # RUN slider fraction on the sim. 1.0 makes the freeze/resume unmistakable in
    # URSim; on the real arm this stays capped low (report §11.2 — cap speed near
    # people), and trajectory-level 5% scaling still applies on top.
    operating_speed_fraction: 1.0

    fjt_action: "/scaled_joint_trajectory_controller/follow_joint_trajectory"

    # --- STOP strategy (pendant-pause task) ------------------------------ #
    # How a full STOP is effected and whether a RESUME continues the SAME trajectory:
    #   "cancel"        (DEFAULT — how THIS cell runs today, HEADLESS): STOP drives the
    #                   slider toward zero; the real full stop is the goal-cancel
    #                   backstop (slider zero floors ~10% on CB3), so a resume is a
    #                   fresh plan (stop-then-replan). See PAUSE_RESUME_FINDING.md.
    #   "pendant_pause" (OPT-IN — only for a cell running a pendant-LOADED External
    #                   Control program, non-headless): STOP issues a dashboard PAUSE
    #                   (freeze on path, scaling->0, goal survives) and a healthy
    #                   CLEAR+dwell RESUME issues PLAY (continues the SAME goal, no
    #                   replan). See PENDANT_PAUSE_FINDING.md. Do NOT select this on the
    #                   cell's headless bring-up — pause is rejected there.
    # The slider stays the SLOW lever and the goal-cancel backstop stays the
    # independent net in BOTH strategies.
    stop_strategy: "cancel"
    # pendant_pause only: refuse to RESUME (play) once the pause has lasted longer than
    # this — the frozen plan is treated as stale and the resume becomes a fresh plan
    # (cancel). Provisional; set at/below the pause duration measured safe in sim
    # (PENDANT_PAUSE_FINDING.md). Tune DOWN only, never above measured-safe.
    resume_max_pause_s: 120.0
    # pendant_pause only: a dashboard PAUSE freezes the arm over ~1.8 s on CB3 (much
    # slower than the slider's ~50 ms). The gate core escalates STOP -> BACKSTOP if the
    # arm is not confirmed stopped within backstop_deadline_s; in pendant mode that
    # deadline is overridden to THIS value so a pause is not cancelled before it
    # freezes. It MUST exceed the measured freeze time; the backstop still fires if the
    # pause has not effected a stop by then. The independent watcher's
    # stop_effect_deadline_s (below) MUST be widened to match, or the watcher cancels
    # the pause instead. Both are re-measured on the real arm (LIVE_TEST.md).
    pendant_freeze_confirm_s: 2.5

human_gate_backstop_watcher:
  ros__parameters:
    arm: false
    robot_ip: "127.0.0.1"
    # The watcher's OWN timeouts (independent of the gate's). Slightly looser than
    # the gate's own (gate heartbeat 0.3 s) so the gate acts first in the healthy
    # case and the watcher is the independent net, not a racing duplicate.
    state_heartbeat_timeout_s: 0.5
    gate_heartbeat_timeout_s: 0.5
    # After a STOP is demanded, the applied scaling must fall below the threshold
    # within this deadline, else the watcher cancels (the STOP did not take effect).
    # DEFAULT 0.7 s suits the `cancel` strategy (slider ~50 ms). For `pendant_pause`,
    # the pause freezes over ~1.8 s, so this MUST be widened (e.g. 3.0 s) to match the
    # gate's pendant_freeze_confirm_s — otherwise the watcher cancels every pause
    # before it freezes (PENDANT_PAUSE_FINDING.md; set via the node's launch param).
    stop_effect_deadline_s: 0.7
    stop_scaling_threshold: 0.05
    startup_grace_s: 3.0
    tick_hz: 25.0
    fjt_action: "/scaled_joint_trajectory_controller/follow_joint_trajectory"
